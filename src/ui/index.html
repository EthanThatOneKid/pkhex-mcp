<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pkhex-mcp Inspector</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="trainerbar">
      <b id="trainer-name">--</b>
      <span class="num" id="trainer-ids">TID ---- / SID ----</span>
      <span class="num" id="trainer-playtime">--:-- played</span>
      <span id="trainer-location">🏅 --</span>
      <span id="dex-chip">Dex: --</span>
      <span id="health">CONNECTING…</span>
    </header>

    <main class="grid" id="party-grid"></main>

    <!-- Chat panel: live chat when BYO key is set, MCP snippet fallback otherwise -->
    <aside class="chat-panel" id="chat-panel">
      <div class="chat-header">
        <h4>Chat</h4>
        <button class="chat-settings" id="chat-settings" aria-label="Chat settings">⚙</button>
        <button class="chat-toggle" id="chat-toggle" aria-label="Collapse chat">▾</button>
      </div>
      <div class="chat-settings-panel" id="chat-settings-panel" hidden>
        <label>Base URL
          <input type="url" id="chat-cfg-url" placeholder="https://api.openai.com/v1" />
        </label>
        <label>API Key
          <input type="password" id="chat-cfg-key" placeholder="sk-..." />
        </label>
        <label>Model
          <input type="text" id="chat-cfg-model" placeholder="gpt-4o-mini" />
        </label>
        <button class="chat-settings-save" id="chat-settings-save">Save</button>
        <p class="chat-settings-note">API key stored locally in this app only.</p>
      </div>

      <!-- Fallback: shown when chat is disabled -->
      <div class="chat-fallback" id="chat-fallback">
        <p>Point any MCP client at the local server:</p>
        <code class="snip" id="mcp-snip"></code>
        <button class="copy" id="copy-snip">Copy snippet</button>
      </div>

      <!-- Live chat: shown when chat is enabled -->
      <div class="chat-live" id="chat-live" hidden>
        <div class="chat-messages" id="chat-messages">
          <div class="chat-empty">Ask about your save file…</div>
        </div>
        <form class="chat-input" id="chat-form">
          <input type="text" id="chat-input" placeholder="e.g. How many badges do I have?" autocomplete="off" />
          <button type="submit" id="chat-send">Send</button>
        </form>
      </div>
    </aside>

    <script src="/ui.js"></script>
  </body>
</html>
